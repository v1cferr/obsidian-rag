[project]
name = "obsidian-rag-backend"
version = "0.1.0"
description = "Backend RAG do chatbot sobre o vault do Obsidian"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "raganything>=1.3.1",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
obsidian-rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
